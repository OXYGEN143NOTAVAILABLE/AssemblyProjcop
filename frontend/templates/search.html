<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search - Assembly PC</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--green:#3ecf5e;--navy:#0d1b2e;--border:#e2e8f0;--muted:#64748b;--bg:#f4f6f8}
    body{font-family:Inter,sans-serif;background:var(--bg);color:#172033;min-height:100vh;overflow-x:hidden}
    nav{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;padding:0 48px;position:sticky;top:0;z-index:10}
    .logo{font-family:Sora,sans-serif;font-weight:800;color:var(--navy);text-decoration:none;min-width:0}
    .search{flex:1;display:flex;gap:8px;min-width:0}
    input{width:100%;min-width:0;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px}
    button,.link{border:none;border-radius:8px;background:var(--navy);color:#fff;padding:10px 16px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
    main{max-width:900px;margin:0 auto;padding:42px 24px}
    h1{font-family:Sora,sans-serif;font-size:34px;margin-bottom:8px;color:var(--navy)}
    .sub{color:var(--muted);margin-bottom:24px}
    .result{display:block;background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:inherit}
    .result:hover{border-color:var(--green);box-shadow:0 6px 20px rgba(15,23,42,.06)}
    .type{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#28a745;margin-bottom:5px}
    .title{font-family:Sora,sans-serif;font-size:17px;font-weight:700;color:var(--navy)}
    .subtitle{font-size:13px;color:var(--muted);margin-top:4px}
    .empty{padding:24px;background:#fff;border:1px dashed #cbd5e1;border-radius:8px;color:var(--muted)}
    @media(max-width:720px){
      nav{height:auto;position:static;align-items:stretch;flex-wrap:wrap;gap:8px;padding:12px 16px}
      .logo{flex:1 1 auto;display:flex;align-items:center;justify-content:center}
      .search{order:3;flex:1 0 100%;display:grid;grid-template-columns:1fr}
      button,.link{padding:9px 12px}
      main{padding:28px 16px}
      h1{font-size:28px}
    }
  </style>
</head>
<body>
  <nav>
    <button class="link" type="button" onclick="history.length > 1 ? history.back() : window.location.href='/'">Back</button>
    <a class="logo" href="/">Assembly PC</a>
    <form class="search" action="/search" method="get">
      <input id="q" name="q" type="search" placeholder="Search published builds, scenarios, or profiles" />
      <button type="submit">Search</button>
    </form>
    <a class="link" href="/gallery">Gallery</a>
  </nav>
  <main>
    <h1>Search</h1>
    <p class="sub" id="summary">Enter a search term to find published PC builds and user profiles.</p>
    <div id="results"></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') || '';
    const q = document.getElementById('q');
    const summary = document.getElementById('summary');
    const results = document.getElementById('results');
    q.value = query;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    async function loadResults() {
      if (query.trim().length < 2) return;
      summary.textContent = `Results for "${query}"`;
      try {
        const response = await fetch('/api/search?q=' + encodeURIComponent(query));
        const data = await response.json();
        const items = data.results || [];
        if (!items.length) {
          results.innerHTML = '<div class="empty">No matching builds, scenarios, or profiles.</div>';
          return;
        }
        results.innerHTML = items.map(item => `
          <a class="result" href="${escapeHtml(item.url)}">
            <div class="type">${escapeHtml(item.type)}</div>
            <div class="title">${escapeHtml(item.title)}</div>
            <div class="subtitle">${escapeHtml(item.subtitle || '')}</div>
          </a>
        `).join('');
      } catch (err) {
        results.innerHTML = '<div class="empty">Search is unavailable right now.</div>';
      }
    }

    loadResults();
    const adminComboKeys = new Set();
    document.addEventListener('keydown', e => {
      adminComboKeys.add(e.key.toLowerCase());
      if (e.shiftKey && adminComboKeys.has('a') && adminComboKeys.has('d')) {
        window.location.href = '/admin/login?back=/';
      }
    });
    document.addEventListener('keyup', e => adminComboKeys.delete(e.key.toLowerCase()));
  </script>
</body>
</html>
